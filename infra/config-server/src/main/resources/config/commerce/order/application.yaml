server:
  port: 0

spring:
  sql:
    init: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5436/sh_commerce_order
    username: user_order
    password: 12345

logging:
  level:
    ru.yandex.practicum: DEBUG
    org:
      hibernate.SQL: TRACE
      springframework: INFO